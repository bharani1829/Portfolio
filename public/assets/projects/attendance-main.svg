<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="attBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>
    <linearGradient id="cppGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#attBg)"/>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#0F141F" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="50" cy="40" r="16" fill="url(#cppGlow)"/>
  <text x="76" y="47" fill="#FFFFFF" font-family="'Great Sailor', monospace" font-weight="bold" font-size="18" letter-spacing="1">C++ ATTENDANCE ENGINE v3.1</text>
  <rect x="940" y="24" width="210" height="34" rx="17" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
  <circle cx="956" cy="41" r="5" fill="#10B981"/>
  <text x="970" y="46" fill="#10B981" font-family="monospace" font-size="12">FILE I/O &amp; DB SYNCED</text>

  <!-- Left: C++ Terminal & OOP Structs -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="510" height="620" rx="18" fill="#0A0C14" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="0" y="0" width="510" height="40" rx="18" fill="#141826"/>
    <circle cx="25" cy="20" r="6" fill="#EF4444"/>
    <circle cx="45" cy="20" r="6" fill="#F59E0B"/>
    <circle cx="65" cy="20" r="6" fill="#10B981"/>
    <text x="95" y="25" fill="#94A3B8" font-family="monospace" font-size="12">attendance_system.cpp — G++ Shell</text>

    <text x="30" y="80" fill="#3B82F6" font-family="monospace" font-size="13">#include &lt;iostream&gt;</text>
    <text x="30" y="105" fill="#3B82F6" font-family="monospace" font-size="13">#include &lt;fstream&gt;</text>
    <text x="30" y="130" fill="#38BDF8" font-family="monospace" font-size="13">class AttendanceRecord {</text>
    <text x="50" y="155" fill="#CBD5E1" font-family="monospace" font-size="12">  string rollNo; string studentName;</text>
    <text x="50" y="180" fill="#CBD5E1" font-family="monospace" font-size="12">  int presentDays; int totalLectures;</text>
    <text x="30" y="205" fill="#38BDF8" font-family="monospace" font-size="13">};</text>

    <rect x="25" y="230" width="460" height="1" fill="#ffffff" fill-opacity="0.1"/>

    <text x="30" y="270" fill="#10B981" font-family="monospace" font-size="13">[SYSTEM] Loading records from students.dat...</text>
    <text x="30" y="300" fill="#F59E0B" font-family="monospace" font-size="13">&gt;&gt; Total Students Tracked: 128</text>
    <text x="30" y="330" fill="#CBD5E1" font-family="monospace" font-size="13">1. Mark Daily Attendance [Batch / Individual]</text>
    <text x="30" y="360" fill="#CBD5E1" font-family="monospace" font-size="13">2. Generate Attendance Percentage Report</text>
    <text x="30" y="390" fill="#CBD5E1" font-family="monospace" font-size="13">3. Defaulter List Filtering (&lt; 75%)</text>
    <text x="30" y="420" fill="#CBD5E1" font-family="monospace" font-size="13">4. Search Student by ID / Roll Number</text>

    <rect x="25" y="460" width="460" height="42" rx="8" fill="#151B2E"/>
    <text x="40" y="487" fill="#10B981" font-family="monospace" font-size="13">&gt; Executing: calculateDefaulters(threshold=75)</text>

    <text x="30" y="540" fill="#EF4444" font-family="monospace" font-size="13">[FLAG] 4 Students require shortage warning notice.</text>
    <text x="30" y="570" fill="#10B981" font-family="monospace" font-size="13">[INFO] Class Aggregate Attendance: 88.4%</text>
    <text x="30" y="600" fill="#38BDF8" font-family="monospace" font-size="13">[OK] Binary serialization written to disk.</text>
  </g>

  <!-- Right: Dashboard & Analytics Panel -->
  <g transform="translate(610, 120)">
    <rect x="0" y="0" width="530" height="620" rx="20" fill="#121724" stroke="#3B82F6" stroke-opacity="0.25"/>

    <!-- Stat Summary Widget -->
    <rect x="30" y="30" width="470" height="130" rx="16" fill="url(#cppGlow)" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.4"/>
    <text x="55" y="65" fill="#94A3B8" font-family="sans-serif" font-size="13">Average Department Attendance</text>
    <text x="55" y="105" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="34">92.6%</text>
    <text x="55" y="135" fill="#10B981" font-family="monospace" font-size="12">128 Active Students • 4 Semesters</text>

    <!-- Student Rows -->
    <g transform="translate(30, 190)">
      <rect x="0" y="0" width="470" height="65" rx="12" fill="#182032" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="32" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">O Leela Bharani (23A91A42xx)</text>
      <text x="20" y="50" fill="#94A3B8" font-family="monospace" font-size="11">AI &amp; ML Dept • 98% Attendance (49/50 Days)</text>
      <rect x="375" y="18" width="75" height="28" rx="14" fill="#10B981" fill-opacity="0.2"/>
      <text x="390" y="37" fill="#10B981" font-family="monospace" font-size="11">REGULAR</text>

      <rect x="0" y="80" width="470" height="65" rx="12" fill="#182032" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="112" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Student Batch A (Roll 101 - 130)</text>
      <text x="20" y="130" fill="#94A3B8" font-family="monospace" font-size="11">Data Structures in C++ • 91.2% Average</text>
      <rect x="375" y="98" width="75" height="28" rx="14" fill="#3B82F6" fill-opacity="0.2"/>
      <text x="395" y="117" fill="#3B82F6" font-family="monospace" font-size="11">VERIFIED</text>

      <rect x="0" y="160" width="470" height="65" rx="12" fill="#182032" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="192" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Student Batch B (Roll 131 - 160)</text>
      <text x="20" y="210" fill="#94A3B8" font-family="monospace" font-size="11">DBMS &amp; Algorithms • 86.8% Average</text>
      <rect x="375" y="178" width="75" height="28" rx="14" fill="#3B82F6" fill-opacity="0.2"/>
      <text x="395" y="197" fill="#3B82F6" font-family="monospace" font-size="11">VERIFIED</text>
    </g>

    <!-- Bottom Log -->
    <rect x="30" y="445" width="470" height="145" rx="14" fill="#101420"/>
    <text x="50" y="475" fill="#94A3B8" font-family="sans-serif" font-weight="bold" font-size="12">SYSTEM AUDIT METRICS</text>
    <text x="50" y="505" fill="#10B981" font-family="monospace" font-size="12">[OK] File Stream: std::ios::binary | std::ios::in</text>
    <text x="50" y="535" fill="#38BDF8" font-family="monospace" font-size="12">[FAST] Time Complexity: O(1) direct record seek</text>
    <text x="50" y="565" fill="#CBD5E1" font-family="monospace" font-size="12">[SAFE] Zero memory leaks, RAII smart pointers</text>
  </g>
</svg>