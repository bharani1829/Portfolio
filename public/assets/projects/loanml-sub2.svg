<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0A0E17"/>
  <rect x="20" y="20" width="560" height="360" rx="14" fill="#111824" stroke="#8B5CF6" stroke-opacity="0.3"/>
  <text x="45" y="60" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16">MATPLOTLIB CONFUSION MATRIX &amp; METRICS</text>

  <g transform="translate(45, 90)">
    <rect x="0" y="0" width="240" height="90" rx="12" fill="#182234" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="35" fill="#94A3B8" font-family="sans-serif" font-size="12">Prediction Accuracy</text>
    <text x="20" y="70" fill="#10B981" font-family="sans-serif" font-weight="bold" font-size="26">89.4%</text>

    <rect x="270" y="0" width="240" height="90" rx="12" fill="#182234" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="35" fill="#94A3B8" font-family="sans-serif" font-size="12" transform="translate(270, 0)">Area Under Curve (AUC)</text>
    <text x="20" y="70" fill="#8B5CF6" font-family="sans-serif" font-weight="bold" font-size="26" transform="translate(270, 0)">0.92</text>
  </g>

  <g transform="translate(45, 210)">
    <rect x="0" y="0" width="510" height="140" rx="12" fill="#151D2C"/>
    <text x="25" y="38" fill="#94A3B8" font-family="monospace" font-size="12">KEY PREDICTIVE ATTRIBUTES:</text>
    <text x="25" y="68" fill="#FFFFFF" font-family="monospace" font-size="12">1. Credit History Score (Impact: 84%)</text>
    <text x="25" y="95" fill="#FFFFFF" font-family="monospace" font-size="12">2. Co-applicant + Applicant Income Ratio (Impact: 72%)</text>
    <text x="25" y="122" fill="#FFFFFF" font-family="monospace" font-size="12">3. Loan Amount to Term Proportion (Impact: 65%)</text>
  </g>
</svg>