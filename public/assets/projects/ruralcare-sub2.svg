<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0D101C"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#g2)" stroke="#D946EF" stroke-opacity="0.3"/>
  <rect x="25" y="25" width="550" height="45" rx="10" fill="#1C2237"/>
  <circle cx="45" cy="47" r="6" fill="#D946EF"/>
  <text x="65" y="52" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Medicine Inventory &amp; Last-Mile Delivery</text>

  <g transform="translate(25, 90)">
    <!-- Med item 1 -->
    <rect x="0" y="0" width="550" height="60" rx="10" fill="#171C2E"/>
    <text x="20" y="28" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Amlodipine 5mg (Anti-hypertensive)</text>
    <text x="20" y="46" fill="#94A3B8" font-family="sans-serif" font-size="11">Patient: Lakshmi Devi • Batch: #AML-401</text>
    <rect x="420" y="16" width="110" height="28" rx="14" fill="#10B981" fill-opacity="0.2"/>
    <text x="440" y="35" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="bold">Dispatched</text>

    <!-- Med item 2 -->
    <rect x="0" y="72" width="550" height="60" rx="10" fill="#171C2E"/>
    <text x="20" y="100" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Metformin 500mg (Glycemic Control)</text>
    <text x="20" y="118" fill="#94A3B8" font-family="sans-serif" font-size="11">Patient: Raju Goud • Batch: #MET-882</text>
    <rect x="420" y="88" width="110" height="28" rx="14" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="448" y="107" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">In Transit</text>

    <!-- Med item 3 -->
    <rect x="0" y="144" width="550" height="60" rx="10" fill="#171C2E"/>
    <text x="20" y="172" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Iron &amp; Folic Acid Supplements</text>
    <text x="20" y="190" fill="#94A3B8" font-family="sans-serif" font-size="11">Patient: Aarthi Mohan • Sub-Center ASHA Worker Assigned</text>
    <rect x="420" y="160" width="110" height="28" rx="14" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="440" y="179" fill="#F59E0B" font-family="sans-serif" font-size="11" font-weight="bold">Out for Delivery</text>
  </g>

  <!-- Bottom progress bar -->
  <rect x="25" y="325" width="550" height="48" rx="10" fill="#161C2C" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="45" y="354" fill="#CBD5E1" font-family="sans-serif" font-size="12">Overall Rural Center Stock Level: <tspan fill="#10B981" font-weight="bold">94% Optimal</tspan></text>
</svg>
