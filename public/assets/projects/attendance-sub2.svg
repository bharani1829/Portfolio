<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0D111A"/>
  <rect x="20" y="20" width="560" height="360" rx="14" fill="#131926" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="45" y="60" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16">ATTENDANCE REPORT METRICS</text>

  <!-- Metric Badges -->
  <g transform="translate(45, 90)">
    <rect x="0" y="0" width="240" height="90" rx="12" fill="#1A2234" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="35" fill="#94A3B8" font-family="sans-serif" font-size="12">Total Registered Students</text>
    <text x="20" y="70" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="26">128</text>

    <rect x="270" y="0" width="240" height="90" rx="12" fill="#1A2234" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="35" fill="#94A3B8" font-family="sans-serif" font-size="12" transform="translate(270, 0)">Eligible for Examinations</text>
    <text x="20" y="70" fill="#10B981" font-family="sans-serif" font-weight="bold" font-size="26" transform="translate(270, 0)">96.8%</text>
  </g>

  <g transform="translate(45, 210)">
    <rect x="0" y="0" width="510" height="140" rx="12" fill="#161E2E"/>
    <text x="25" y="38" fill="#94A3B8" font-family="monospace" font-size="12">SUBJECT-WISE BREAKDOWN:</text>
    <text x="25" y="68" fill="#FFFFFF" font-family="monospace" font-size="12">1. Artificial Intelligence &amp; ML : 95.4%</text>
    <text x="25" y="95" fill="#FFFFFF" font-family="monospace" font-size="12">2. Database Management Systems   : 92.1%</text>
    <text x="25" y="122" fill="#FFFFFF" font-family="monospace" font-size="12">3. Data Structures &amp; C++         : 94.0%</text>
  </g>
</svg>