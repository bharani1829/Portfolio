<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="50%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>
    <linearGradient id="mlGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#mlBg)"/>

  <!-- Top Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#0F141E" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="50" cy="40" r="16" fill="url(#mlGlow)"/>
  <text x="76" y="47" fill="#FFFFFF" font-family="'Great Sailor', monospace" font-weight="bold" font-size="18" letter-spacing="1">LOAN PREDICTION ML PIPELINE</text>
  <rect x="940" y="24" width="210" height="34" rx="17" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
  <circle cx="956" cy="41" r="5" fill="#10B981"/>
  <text x="970" y="46" fill="#10B981" font-family="monospace" font-size="12">MODEL ACCURACY: 89.4%</text>

  <!-- Left: Python, Pandas & NumPy Script Terminal -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="510" height="620" rx="18" fill="#0A0D14" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="0" y="0" width="510" height="40" rx="18" fill="#121824"/>
    <circle cx="25" cy="20" r="6" fill="#EF4444"/>
    <circle cx="45" cy="20" r="6" fill="#F59E0B"/>
    <circle cx="65" cy="20" r="6" fill="#10B981"/>
    <text x="95" y="25" fill="#94A3B8" font-family="monospace" font-size="12">loan_prediction_eda.py — Jupyter Kernel</text>

    <text x="30" y="80" fill="#10B981" font-family="monospace" font-size="13">import numpy as np</text>
    <text x="30" y="105" fill="#10B981" font-family="monospace" font-size="13">import pandas as pd</text>
    <text x="30" y="130" fill="#10B981" font-family="monospace" font-size="13">import matplotlib.pyplot as plt</text>
    
    <text x="30" y="165" fill="#38BDF8" font-family="monospace" font-size="12"># 1. Load Dataset &amp; Handle Missing Values</text>
    <text x="30" y="190" fill="#CBD5E1" font-family="monospace" font-size="12">df = pd.read_csv('loan_eligibility.csv')</text>
    <text x="30" y="215" fill="#CBD5E1" font-family="monospace" font-size="12">df['LoanAmount'] = df['LoanAmount'].fillna(df['LoanAmount'].median())</text>
    <text x="30" y="240" fill="#CBD5E1" font-family="monospace" font-size="12">df['TotalIncome'] = df['ApplicantIncome'] + df['CoapplicantIncome']</text>

    <rect x="25" y="265" width="460" height="1" fill="#ffffff" fill-opacity="0.1"/>

    <text x="30" y="300" fill="#F59E0B" font-family="monospace" font-size="12"># 2. Log Transform with NumPy for Normal Dist</text>
    <text x="30" y="325" fill="#CBD5E1" font-family="monospace" font-size="12">df['TotalIncome_log'] = np.log(df['TotalIncome'])</text>
    <text x="30" y="350" fill="#CBD5E1" font-family="monospace" font-size="12">df['LoanAmount_log'] = np.log(df['LoanAmount'])</text>

    <text x="30" y="390" fill="#8B5CF6" font-family="monospace" font-size="12"># 3. Model Training &amp; Feature Importance</text>
    <text x="30" y="415" fill="#CBD5E1" font-family="monospace" font-size="12">features = ['Credit_History', 'TotalIncome_log', 'LoanAmount_log']</text>

    <rect x="25" y="445" width="460" height="42" rx="8" fill="#121D2C"/>
    <text x="40" y="472" fill="#10B981" font-family="monospace" font-size="13">&gt;&gt; Model Evaluation: Precision 0.91, Recall 0.88</text>

    <text x="30" y="525" fill="#10B981" font-family="monospace" font-size="12">[EDA] Credit_History is primary decision factor (84%)</text>
    <text x="30" y="555" fill="#38BDF8" font-family="monospace" font-size="12">[VIZ] Matplotlib distributions saved: loan_approval_dist.png</text>
    <text x="30" y="585" fill="#CBD5E1" font-family="monospace" font-size="12">[RESULT] Automated underwriting risk score generated.</text>
  </g>

  <!-- Right: Matplotlib Analytics & Approval Insights -->
  <g transform="translate(610, 120)">
    <rect x="0" y="0" width="530" height="620" rx="20" fill="#101724" stroke="#10B981" stroke-opacity="0.25"/>

    <!-- Score Card Widget -->
    <rect x="30" y="30" width="470" height="130" rx="16" fill="url(#mlGlow)" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="55" y="65" fill="#94A3B8" font-family="sans-serif" font-size="13">Model Classification Accuracy</text>
    <text x="55" y="105" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="34">89.4% F1-Score</text>
    <text x="55" y="135" fill="#10B981" font-family="monospace" font-size="12">614 Evaluated Loan Records • 0 Data Leaks</text>

    <!-- Synthetic Matplotlib Graph Chart -->
    <g transform="translate(30, 190)">
      <rect x="0" y="0" width="470" height="230" rx="12" fill="#141E2D" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="25" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12">Matplotlib: Approval Rate vs Credit History</text>

      <!-- Bar Graph -->
      <!-- Credit History = 1 (Approved) -->
      <rect x="80" y="60" width="70" height="120" rx="6" fill="#10B981"/>
      <text x="95" y="115" fill="#000000" font-family="monospace" font-weight="bold" font-size="14">84%</text>
      <text x="75" y="200" fill="#CBD5E1" font-family="monospace" font-size="11">Cred Hist = 1</text>
      <text x="80" y="215" fill="#10B981" font-family="monospace" font-size="10">APPROVED</text>

      <!-- Credit History = 0 (Rejected) -->
      <rect x="230" y="145" width="70" height="35" rx="6" fill="#EF4444"/>
      <text x="245" y="170" fill="#FFFFFF" font-family="monospace" font-weight="bold" font-size="14">9%</text>
      <text x="225" y="200" fill="#CBD5E1" font-family="monospace" font-size="11">Cred Hist = 0</text>
      <text x="230" y="215" fill="#EF4444" font-family="monospace" font-size="10">APPROVED</text>

      <!-- Overall Approved -->
      <rect x="360" y="80" width="70" height="100" rx="6" fill="#38BDF8"/>
      <text x="375" y="130" fill="#000000" font-family="monospace" font-weight="bold" font-size="14">69%</text>
      <text x="355" y="200" fill="#CBD5E1" font-family="monospace" font-size="11">Total Cohort</text>
      <text x="360" y="215" fill="#38BDF8" font-family="monospace" font-size="10">APPROVED</text>
    </g>

    <!-- Bottom Insights -->
    <rect x="30" y="445" width="470" height="145" rx="14" fill="#0C131E"/>
    <text x="50" y="475" fill="#94A3B8" font-family="sans-serif" font-weight="bold" font-size="12">DATA SCIENCE TOOLKIT HIGHLIGHTS</text>
    <text x="50" y="505" fill="#10B981" font-family="monospace" font-size="12">[Pandas] Outlier detection &amp; categorical encoding</text>
    <text x="50" y="535" fill="#38BDF8" font-family="monospace" font-size="12">[NumPy] Vectorized matrix operations &amp; logarithmic scaling</text>
    <text x="50" y="565" fill="#F59E0B" font-family="monospace" font-size="12">[Matplotlib] Correlation heatmaps and feature distributions</text>
  </g>
</svg>