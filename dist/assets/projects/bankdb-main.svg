<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D14"/>
      <stop offset="50%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#06090F"/>
    </linearGradient>
    <linearGradient id="sqlGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00758F"/>
      <stop offset="50%" stop-color="#F29111"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#dbBg)"/>

  <!-- Top Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#0D1420" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="50" cy="40" r="16" fill="url(#sqlGlow)"/>
  <text x="76" y="47" fill="#FFFFFF" font-family="'Great Sailor', monospace" font-weight="bold" font-size="18" letter-spacing="1">MYSQL BANKING ENTERPRISE RDBMS</text>
  <rect x="940" y="24" width="210" height="34" rx="17" fill="#00758F" fill-opacity="0.2" stroke="#00758F" stroke-opacity="0.5"/>
  <circle cx="956" cy="41" r="5" fill="#38BDF8"/>
  <text x="970" y="46" fill="#38BDF8" font-family="monospace" font-size="12">ACID TRANSACTIONS ON</text>

  <!-- Left: SQL Query & Schema Terminal -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="510" height="620" rx="18" fill="#080C14" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="0" y="0" width="510" height="40" rx="18" fill="#111827"/>
    <circle cx="25" cy="20" r="6" fill="#EF4444"/>
    <circle cx="45" cy="20" r="6" fill="#F59E0B"/>
    <circle cx="65" cy="20" r="6" fill="#10B981"/>
    <text x="95" y="25" fill="#94A3B8" font-family="monospace" font-size="12">mysql&gt; bank_management_schema.sql</text>

    <text x="30" y="80" fill="#00758F" font-family="monospace" font-size="13">USE bank_enterprise_db;</text>
    <text x="30" y="110" fill="#F29111" font-family="monospace" font-size="13">CREATE TABLE accounts (</text>
    <text x="50" y="135" fill="#CBD5E1" font-family="monospace" font-size="12">  acc_no BIGINT PRIMARY KEY AUTO_INCREMENT,</text>
    <text x="50" y="160" fill="#CBD5E1" font-family="monospace" font-size="12">  cust_name VARCHAR(100) NOT NULL,</text>
    <text x="50" y="185" fill="#CBD5E1" font-family="monospace" font-size="12">  balance DECIMAL(15,2) CHECK (balance &gt;= 500),</text>
    <text x="50" y="210" fill="#CBD5E1" font-family="monospace" font-size="12">  acc_type ENUM('Savings', 'Current', 'FD'),</text>
    <text x="50" y="235" fill="#CBD5E1" font-family="monospace" font-size="12">  status VARCHAR(20) DEFAULT 'ACTIVE'</text>
    <text x="30" y="260" fill="#F29111" font-family="monospace" font-size="13">);</text>

    <rect x="25" y="285" width="460" height="1" fill="#ffffff" fill-opacity="0.1"/>

    <text x="30" y="325" fill="#38BDF8" font-family="monospace" font-size="13">START TRANSACTION;</text>
    <text x="30" y="355" fill="#CBD5E1" font-family="monospace" font-size="12">UPDATE accounts SET balance = balance - 15000 WHERE acc_no = 1042;</text>
    <text x="30" y="380" fill="#CBD5E1" font-family="monospace" font-size="12">UPDATE accounts SET balance = balance + 15000 WHERE acc_no = 2088;</text>
    <text x="30" y="405" fill="#38BDF8" font-family="monospace" font-size="13">COMMIT;</text>

    <rect x="25" y="435" width="460" height="42" rx="8" fill="#10192A"/>
    <text x="40" y="462" fill="#10B981" font-family="monospace" font-size="13">&gt; Query OK, 2 rows affected (0.003 sec)</text>

    <text x="30" y="520" fill="#10B981" font-family="monospace" font-size="13">[TRIGGER] audit_log_trigger fired on UPDATE</text>
    <text x="30" y="550" fill="#38BDF8" font-family="monospace" font-size="13">[INDEX] B-Tree Index created on (cust_name, acc_no)</text>
    <text x="30" y="580" fill="#F59E0B" font-family="monospace" font-size="13">[SECURITY] Foreign Keys with CASCADE protection</text>
  </g>

  <!-- Right: Relational Tables & Ledger View -->
  <g transform="translate(610, 120)">
    <rect x="0" y="0" width="530" height="620" rx="20" fill="#0F1626" stroke="#00758F" stroke-opacity="0.3"/>

    <!-- Total Deposits Widget -->
    <rect x="30" y="30" width="470" height="130" rx="16" fill="url(#sqlGlow)" fill-opacity="0.12" stroke="#00758F" stroke-opacity="0.5"/>
    <text x="55" y="65" fill="#94A3B8" font-family="sans-serif" font-size="13">Bank Total Managed Vault Assets</text>
    <text x="55" y="105" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="34">₹ 8,42,50,000</text>
    <text x="55" y="135" fill="#10B981" font-family="monospace" font-size="12">1,480 Active Accounts • 0 Deadlocks</text>

    <!-- Table Preview -->
    <g transform="translate(30, 190)">
      <rect x="0" y="0" width="470" height="230" rx="12" fill="#141E32" stroke="#ffffff" stroke-opacity="0.08"/>
      
      <!-- Table Header -->
      <rect x="0" y="0" width="470" height="40" rx="12" fill="#1B2844"/>
      <text x="20" y="25" fill="#38BDF8" font-family="monospace" font-size="12">ACC_NO</text>
      <text x="110" y="25" fill="#38BDF8" font-family="monospace" font-size="12">HOLDER</text>
      <text x="250" y="25" fill="#38BDF8" font-family="monospace" font-size="12">TYPE</text>
      <text x="360" y="25" fill="#38BDF8" font-family="monospace" font-size="12">BALANCE (₹)</text>

      <!-- Row 1 -->
      <text x="20" y="70" fill="#CBD5E1" font-family="monospace" font-size="12">#100291</text>
      <text x="110" y="70" fill="#FFFFFF" font-family="monospace" font-size="12">O Leela B.</text>
      <text x="250" y="70" fill="#94A3B8" font-family="monospace" font-size="12">Savings</text>
      <text x="360" y="70" fill="#10B981" font-family="monospace" font-weight="bold" font-size="12">₹ 2,45,000</text>

      <!-- Row 2 -->
      <text x="20" y="110" fill="#CBD5E1" font-family="monospace" font-size="12">#100292</text>
      <text x="110" y="110" fill="#FFFFFF" font-family="monospace" font-size="12">Aditya Org</text>
      <text x="250" y="110" fill="#94A3B8" font-family="monospace" font-size="12">Current</text>
      <text x="360" y="110" fill="#10B981" font-family="monospace" font-weight="bold" font-size="12">₹ 14,80,000</text>

      <!-- Row 3 -->
      <text x="20" y="150" fill="#CBD5E1" font-family="monospace" font-size="12">#100293</text>
      <text x="110" y="150" fill="#FFFFFF" font-family="monospace" font-size="12">Tech Corp</text>
      <text x="250" y="150" fill="#94A3B8" font-family="monospace" font-size="12">Enterprise</text>
      <text x="360" y="150" fill="#10B981" font-family="monospace" font-weight="bold" font-size="12">₹ 45,00,000</text>

      <!-- Row 4 -->
      <text x="20" y="190" fill="#CBD5E1" font-family="monospace" font-size="12">#100294</text>
      <text x="110" y="190" fill="#FFFFFF" font-family="monospace" font-size="12">Personal FD</text>
      <text x="250" y="190" fill="#94A3B8" font-family="monospace" font-size="12">Fixed Dep</text>
      <text x="360" y="190" fill="#10B981" font-family="monospace" font-weight="bold" font-size="12">₹ 5,00,000</text>
    </g>

    <!-- Bottom RDBMS Stats -->
    <rect x="30" y="445" width="470" height="145" rx="14" fill="#0C121E"/>
    <text x="50" y="475" fill="#94A3B8" font-family="sans-serif" font-weight="bold" font-size="12">RDBMS ARCHITECTURE INTEGRITY</text>
    <text x="50" y="505" fill="#10B981" font-family="monospace" font-size="12">[ACID] Atomicity, Consistency, Isolation, Durability</text>
    <text x="50" y="535" fill="#38BDF8" font-family="monospace" font-size="12">[VIEWS] Automated monthly statement generation</text>
    <text x="50" y="565" fill="#F59E0B" font-family="monospace" font-size="12">[SECURITY] Role-based grants for tellers and admins</text>
  </g>
</svg>