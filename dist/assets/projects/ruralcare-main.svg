    <text x="170" y="264" fill="#FFFFFF" font-weight="600" font-size="13">Aarthi Mohan (19)</text>
    <text x="310" y="264" fill="#CBD5E1" font-size="13">Severe Anemia Follow-up</text>
    <text x="510" y="264" fill="#CBD5E1" font-size="13">Dr. R. Vani (Gynec)</text>
    <rect x="680" y="248" width="110" height="26" rx="13" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.4"/>
    <text x="694" y="265" fill="#F59E0B" font-size="11" font-weight="600">Meds In Transit</text>

    <!-- Row 4 -->
    <text x="45" y="318" fill="#38BDF8" font-family="monospace" font-size="12">#RC-8924</text>
    <text x="170" y="318" fill="#FFFFFF" font-weight="600" font-size="13">Raju Goud (61)</text>
    <text x="310" y="318" fill="#CBD5E1" font-size="13">Diabetes Routine Review</text>
    <text x="510" y="318" fill="#CBD5E1" font-size="13">Dr. K. S. Rao (Endo)</text>
    <rect x="680" y="302" width="110" height="26" rx="13" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="704" y="319" fill="#10B981" font-size="11" font-weight="600">Stable / Done</text>
