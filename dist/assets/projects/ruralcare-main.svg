    <text x="310" y="156" fill="#CBD5E1" font-size="13">Acute Hypertension / High BP</text>
    <text x="510" y="156" fill="#CBD5E1" font-size="13">Dr. K. S. Rao (Cardio)</text>
    <rect x="680" y="140" width="110" height="26" rx="13" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-opacity="0.4"/>
